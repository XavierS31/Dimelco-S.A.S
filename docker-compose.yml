services:
  api:
    build:
      context: ./backend/node
      target: production
    env_file:
      - path: ./backend/node/.env
        required: false
    environment:
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
