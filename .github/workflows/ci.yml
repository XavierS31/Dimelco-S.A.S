name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  containers:
    name: Build and validate containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build API container and type-check backend
        run: docker build --no-cache --target build --tag dimelco-api-check ./backend/node
      - name: Build Lambda container
        run: docker build --no-cache --file ./backend/node/Dockerfile.lambda --tag dimelco-lambda-check ./backend/node
      - name: Build frontend with API Gateway URL
        env:
          VITE_API_BASE_URL: https://3l56185nu6.execute-api.us-east-2.amazonaws.com
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
      - name: Build and lint frontend container
        env:
          VITE_API_BASE_URL: https://3l56185nu6.execute-api.us-east-2.amazonaws.com
        run: docker build --no-cache --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" --target build --tag dimelco-web-check ./frontend
      - uses: aws-actions/setup-sam@v2
      - name: Validate AWS SAM template
        run: sam validate --template-file infrastructure/template.yaml --region us-east-2
